# Lu automatiquement par Spark (SPARK_CONF_DIR=/opt/spark-conf) : plus aucune config dans le code.

# --- Cluster
spark.master                          spark://spark-master:7077
spark.driver.host                     airflow-scheduler
spark.driver.bindAddress              0.0.0.0

# --- MinIO (S3) : bronze = s3a://bronze/
spark.hadoop.fs.s3a.endpoint          http://minio:9000
spark.hadoop.fs.s3a.access.key        minioadmin
spark.hadoop.fs.s3a.secret.key        minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.impl              org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl               org.apache.hadoop.fs.s3a.S3AFileSystem

# --- Iceberg : catalogue "lake" (JDBC sur Postgres), donnees dans s3://warehouse/
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog              lake
spark.sql.catalog.lake                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.catalog-impl   org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lake.uri            jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lake.jdbc.user      iceberg
spark.sql.catalog.lake.jdbc.password  iceberg
spark.sql.catalog.lake.jdbc.schema-version V1
spark.sql.catalog.lake.warehouse      s3://warehouse/
